<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poll Admin - LivePolling</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container admin">
    <header>
      <h1>Poll Admin</h1>
      <span id="status" class="status disconnected">Disconnected</span>
    </header>

    <div id="login-overlay" class="overlay">
      <div class="login-box">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="admin">
        <button id="login-btn">Login</button>
        <p id="login-error" class="error"></p>
      </div>
    </div>

    <main id="main-content" class="hidden">
      <section id="stats-section">
        <h2>Statistics</h2>
        <div id="statistics">
          <p class="empty">No active question</p>
        </div>
      </section>

      <section id="question-section">
        <h2>Create Question</h2>
        <textarea id="question-input" placeholder="Enter your question..."></textarea>
        <div id="choices">
          <div class="choice-row">
            <input type="text" class="choice-input" placeholder="Choice 1" value="Yes">
          </div>
          <div class="choice-row">
            <input type="text" class="choice-input" placeholder="Choice 2" value="No">
          </div>
        </div>
        <button id="add-choice">+ Add Choice</button>
        <div class="actions">
          <button id="ask-btn" class="primary">Ask Question</button>
          <button id="reset-btn" class="secondary">Reset Votes</button>
          <button id="clear-btn" class="danger">Clear</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/ws-client.js"></script>
  <script>
    const client = new PollingClient();
    const statusEl = document.getElementById('status');
    const loginOverlay = document.getElementById('login-overlay');
    const mainContent = document.getElementById('main-content');
    const loginError = document.getElementById('login-error');
    const statsEl = document.getElementById('statistics');
    const questionInput = document.getElementById('question-input');
    const choicesEl = document.getElementById('choices');

    let authenticated = false;

    client.on('connect', () => {
      statusEl.textContent = 'Connected';
      statusEl.className = 'status connected';
      client.init('admin');
    });

    client.on('close', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.className = 'status disconnected';
      authenticated = false;
      loginOverlay.classList.remove('hidden');
      mainContent.classList.add('hidden');
      setTimeout(() => client.connect(), 2000);
    });

    client.on('error', () => {
      statusEl.textContent = 'Error';
      statusEl.className = 'status error';
    });

    client.on('login', (data) => {
      if (data === true) {
        authenticated = true;
        loginOverlay.classList.add('hidden');
        mainContent.classList.remove('hidden');
        client.requestStatistics();
      }
    });

    client.on('message', (data) => {
      if (!authenticated && typeof data === 'string') {
        loginError.textContent = data;
      }
    });

    client.on('statistics', (stats) => {
      renderStats(stats);
    });

    client.on('clear', () => {
      statsEl.innerHTML = '<p class="empty">No active question</p>';
    });

    function renderStats(stats) {
      if (!stats.text) {
        statsEl.innerHTML = '<p class="empty">No active question</p>';
        return;
      }

      const totalVotes = stats.votes.reduce((a, b) => a + b, 0);
      const bars = stats.choices.map((choice, i) => {
        const votes = stats.votes[i];
        const pct = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
        return `
          <div class="stat-row">
            <span class="stat-label">${escapeHtml(choice)}</span>
            <div class="bar-container">
              <div class="bar" style="width: ${pct}%"></div>
            </div>
            <span class="stat-count">${votes} (${pct}%)</span>
          </div>
        `;
      }).join('');

      statsEl.innerHTML = `
        <p class="question-text">${escapeHtml(stats.text)}</p>
        <p class="total">Total votes: ${totalVotes}</p>
        ${bars}
      `;
    }

    function getChoices() {
      return Array.from(document.querySelectorAll('.choice-input'))
        .map(input => input.value.trim())
        .filter(v => v.length > 0);
    }

    function addChoice() {
      const count = choicesEl.children.length + 1;
      const div = document.createElement('div');
      div.className = 'choice-row';
      div.innerHTML = `<input type="text" class="choice-input" placeholder="Choice ${count}">`;
      choicesEl.appendChild(div);
    }

    document.getElementById('login-btn').addEventListener('click', () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      loginError.textContent = '';
      client.login(username, password);
    });

    document.getElementById('username').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('add-choice').addEventListener('click', addChoice);

    document.getElementById('ask-btn').addEventListener('click', () => {
      const question = questionInput.value.trim();
      const choices = getChoices();
      if (!question || choices.length < 2) {
        alert('Please enter a question and at least 2 choices');
        return;
      }
      client.sendQuestion(question, choices);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('Reset all votes?')) {
        client.reset();
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('Clear the current question?')) {
        client.clear();
        questionInput.value = '';
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    client.connect().catch(() => {});
  </script>
</body>
</html>
